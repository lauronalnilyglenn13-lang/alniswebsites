<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Birthday Letter For You 💌🎂</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Quicksand:wght@500;600&display=swap" rel="stylesheet">

<style>
/* ==========================================================
   1. EASY COLOR SETTINGS  (change these to restyle everything)
   ========================================================== */
:root {
  --candy-pink:   #ff9ebb;
  --blush:        #ffd6e3;
  --rose:         #ff5c8a;
  --cherry-red:   #d6254d;
  --deep-wine:    #8c1237;
  --cream:        #fff6f0;
  --gold:         #ffd36e;

  /* >>> CUSTOM BACKGROUND <<<
     Default is a gradient. Change the colors, or use a picture
     by setting backgroundImage in CONFIG (inside the <script>). */
  --page-background: linear-gradient(160deg, #ffc2d6 0%, #ff8fb1 45%, #d6254d 100%);

  --font-script: "Great Vibes", cursive;
  --font-body:   "Quicksand", sans-serif;
}

/* ==========================================================
   2. PAGE BASICS
   ========================================================== */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }

body {
  font-family: var(--font-body);
  background: var(--page-background);
  background-attachment: fixed;
  overflow-x: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--deep-wine);
  -webkit-tap-highlight-color: transparent;
}

/* sparkly dots over the background */
body::before {
  content: "";
  position: fixed; inset: 0;
  background-image:
    radial-gradient(circle at 20% 25%, rgba(255,255,255,.35) 0 2px, transparent 3px),
    radial-gradient(circle at 70% 15%, rgba(255,255,255,.3) 0 3px, transparent 4px),
    radial-gradient(circle at 85% 70%, rgba(255,255,255,.3) 0 2px, transparent 3px),
    radial-gradient(circle at 30% 80%, rgba(255,255,255,.3) 0 3px, transparent 4px);
  background-size: 260px 260px;
  pointer-events: none;
}

/* ==========================================================
   3. BIRTHDAY BUNTING (flags across the top)
   ========================================================== */
.bunting {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 54px;
  display: flex;
  justify-content: space-around;
  z-index: 3;
  pointer-events: none;
}
.bunting i {
  width: 34px; height: 44px;
  clip-path: polygon(0 0, 100% 0, 50% 100%);
  transform-origin: top center;
  animation: sway 3s ease-in-out infinite;
}
.bunting i:nth-child(4n+1) { background: var(--rose); }
.bunting i:nth-child(4n+2) { background: var(--cream); }
.bunting i:nth-child(4n+3) { background: var(--cherry-red); }
.bunting i:nth-child(4n)   { background: var(--gold); }
.bunting i:nth-child(even) { animation-delay: -1.2s; }
@keyframes sway { 50% { transform: rotate(7deg); } }

/* ==========================================================
   4. FLOATING HEARTS + CONFETTI (created by JavaScript)
   ========================================================== */
.floating-heart {
  position: fixed;
  bottom: -40px;
  pointer-events: none;
  animation: floatUp linear forwards;
  opacity: 0;
  z-index: 1;
}
@keyframes floatUp {
  0%   { transform: translateY(0) rotate(0deg); opacity: 0; }
  10%  { opacity: .85; }
  100% { transform: translateY(-110vh) rotate(40deg); opacity: 0; }
}

.confetti {
  position: fixed;
  top: -20px;
  width: 10px; height: 16px;
  pointer-events: none;
  z-index: 30;
  animation: fall linear forwards;
}
@keyframes fall {
  to { transform: translateY(110vh) rotate(720deg); }
}

/* ==========================================================
   5. THE SCENE + ENVELOPE
   ========================================================== */
.scene {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 28px;
  padding: 20px;
  margin-top: 40px;
}

.hint {
  font-family: var(--font-script);
  font-size: 2rem;
  text-align: center;
  color: var(--cream);
  text-shadow: 0 2px 8px rgba(140,18,55,.45);
  animation: pulse 1.8s ease-in-out infinite;
  transition: opacity .4s;
}
@keyframes pulse { 50% { transform: scale(1.07); } }

.envelope {
  position: relative;
  width: min(340px, 82vw);
  aspect-ratio: 3 / 2;
  background: var(--candy-pink);
  border-radius: 8px;
  cursor: pointer;
  box-shadow: 0 20px 40px rgba(140,18,55,.4);
  transition: transform .6s ease;
}
.envelope:hover { transform: translateY(-4px) rotate(-1deg); }

.envelope .back {
  position: absolute; inset: 0;
  background: var(--rose);
  border-radius: 8px;
}

/* little card peeking out of the envelope */
.letter {
  position: absolute;
  left: 7%; right: 7%;
  top: 8%;
  height: 84%;
  background: var(--cream);
  border-radius: 6px;
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-script);
  font-size: 1.9rem;
  color: var(--cherry-red);
  transition: transform .9s ease .45s;
}

/* front pocket */
.pocket {
  position: absolute; inset: 0;
  z-index: 3;
  border-radius: 8px;
  overflow: hidden;
  pointer-events: none;
}
.pocket::before, .pocket::after {
  content: "";
  position: absolute;
  top: 0; bottom: 0;
  width: 55%;
  background: var(--candy-pink);
}
.pocket::before { left: 0;  clip-path: polygon(0 0, 100% 50%, 0 100%); }
.pocket::after  { right: 0; clip-path: polygon(100% 0, 0 50%, 100% 100%); }
.pocket .bottom-fold {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 62%;
  background: #ff86aa;
  clip-path: polygon(0 100%, 50% 0, 100% 100%);
  z-index: 1;
}

/* top flap that opens */
.flap {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 58%;
  background: #ff7aa2;
  clip-path: polygon(0 0, 100% 0, 50% 100%);
  transform-origin: top;
  transition: transform .6s ease, z-index 0s .3s;
  z-index: 4;
}

/* red wax heart seal */
.seal {
  position: absolute;
  left: 50%; top: 52%;
  transform: translate(-50%, -50%);
  width: 52px; height: 52px;
  background: radial-gradient(circle at 35% 30%, #ff6b8e, var(--cherry-red) 60%, var(--deep-wine));
  border-radius: 50%;
  z-index: 5;
  display: grid;
  place-items: center;
  color: var(--cream);
  font-size: 1.4rem;
  box-shadow: 0 4px 10px rgba(0,0,0,.35);
  transition: opacity .3s;
}

/* OPEN STATE (JavaScript adds the class "open") */
.envelope.open { transform: translateY(70px); cursor: default; }
.envelope.open .flap   { transform: rotateX(180deg); z-index: 1; }
.envelope.open .seal   { opacity: 0; }
.envelope.open .letter { transform: translateY(-60%); }
.scene.opened .hint    { opacity: 0; }

/* ==========================================================
   6. THE FULL LETTER (appears after tapping)
   ========================================================== */
.reader {
  position: fixed; inset: 0;
  z-index: 10;
  display: grid;
  place-items: center;
  padding: 20px;
  background: rgba(140, 18, 55, .55);
  backdrop-filter: blur(6px);
  opacity: 0;
  pointer-events: none;
  transition: opacity .6s ease;
}
.reader.show { opacity: 1; pointer-events: auto; }

.paper {
  position: relative;
  width: min(520px, 100%);
  max-height: 88vh;
  overflow-y: auto;
  background:
    repeating-linear-gradient(transparent 0 31px, rgba(255,92,138,.18) 31px 32px),
    var(--cream);
  border-radius: 10px;
  padding: 34px 30px 28px;
  box-shadow: 0 25px 60px rgba(0,0,0,.4);
  transform: translateY(40px) scale(.92);
  transition: transform .7s cubic-bezier(.2,.9,.3,1.2);
  border-top: 8px solid var(--rose);
}
.reader.show .paper { transform: none; }

.occasion {
  font-family: var(--font-script);
  font-size: 1.7rem;
  color: var(--rose);
  text-align: center;
}
.paper h1 {
  font-family: var(--font-script);
  font-weight: 400;
  font-size: 2.6rem;
  color: var(--cherry-red);
  margin: 4px 0 12px;
}
.paper p {
  font-size: 1.05rem;
  line-height: 2rem;      /* matches the ruled lines */
  font-weight: 500;
  white-space: pre-line;
}
.paper .signature {
  font-family: var(--font-script);
  font-size: 2.1rem;
  color: var(--cherry-red);
  margin-top: 16px;
  text-align: right;
}

/* ==========================================================
   7. BIRTHDAY CAKE (tap the flame to blow it out)
   ========================================================== */
.cake-area { text-align: center; margin-top: 22px; }
.cake {
  position: relative;
  width: 150px; margin: 0 auto;
  cursor: pointer;
}
.flame {
  display: block;
  font-size: 1.9rem;
  height: 34px;
  transform-origin: bottom;
  animation: flicker .5s ease-in-out infinite alternate;
  transition: opacity .4s, transform .4s;
}
.flame.out { opacity: 0; transform: translateY(-14px) scale(.4); animation: none; }
@keyframes flicker { to { transform: scale(1.12) rotate(4deg); } }

.candle {
  width: 8px; height: 26px; margin: 0 auto;
  background: repeating-linear-gradient(45deg, var(--cream) 0 5px, var(--rose) 5px 10px);
  border-radius: 3px;
}
.layer-top {
  height: 36px; background: var(--candy-pink);
  border-radius: 12px 12px 0 0; border-bottom: 5px solid var(--cream);
}
.layer-bottom {
  height: 44px; background: var(--cherry-red);
  border-radius: 0 0 12px 12px;
  box-shadow: 0 6px 0 rgba(140,18,55,.25);
}
.wish {
  margin-top: 12px;
  font-family: var(--font-script);
  font-size: 1.6rem;
  color: var(--cherry-red);
  min-height: 2rem;
}

.close-btn {
  display: block;
  margin: 18px auto 0;
  padding: 10px 26px;
  font: 600 1rem var(--font-body);
  color: var(--cream);
  background: linear-gradient(135deg, var(--rose), var(--cherry-red));
  border: none;
  border-radius: 999px;
  cursor: pointer;
  box-shadow: 0 6px 14px rgba(214,37,77,.4);
}
.close-btn:active { transform: scale(.96); }

/* ==========================================================
   8. MUSIC BUTTON
   ========================================================== */
.music-btn {
  position: fixed;
  top: 64px; right: 16px;
  z-index: 20;
  width: 48px; height: 48px;
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,.7);
  background: rgba(214,37,77,.85);
  color: #fff;
  font-size: 1.3rem;
  cursor: pointer;
  display: none;           /* shown by JS only if a music file is set */
}
.music-btn.playing { animation: spin 4s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition-duration: .01s !important; }
}
</style>
</head>

<body>

<!-- ==========================================================
     HTML STRUCTURE
     ========================================================== -->
<div class="bunting" id="bunting"></div>

<button class="music-btn" id="musicBtn" aria-label="Play or pause music">♪</button>

<main class="scene" id="scene">
  <p class="hint" id="hint">tap the envelope 💌</p>

  <div class="envelope" id="envelope" role="button" tabindex="0" aria-label="Open your letter">
    <div class="back"></div>
    <div class="letter" id="envelopeLabel">For you…</div>
    <div class="pocket"><div class="bottom-fold"></div></div>
    <div class="flap"></div>
    <div class="seal">♥</div>
  </div>
</main>

<!-- The big letter that pops up -->
<section class="reader" id="reader">
  <div class="paper">
    <div class="occasion" id="occasion"></div>
    <h1 id="letterTitle"></h1>
    <p id="letterBody"></p>
    <p class="signature" id="letterSignature"></p>

    <div class="cake-area">
      <div class="cake" id="cake" title="Tap to blow out the candle">
        <span class="flame" id="flame">🔥</span>
        <div class="candle"></div>
        <div class="layer-top"></div>
        <div class="layer-bottom"></div>
      </div>
      <div class="wish" id="wish">tap the flame &amp; make a wish ✨</div>
    </div>

    <button class="close-btn" id="closeBtn">Close letter</button>
  </div>
</section>


<script>
/* ==========================================================
   CONFIG  ←  THE ONLY PART YOU NEED TO EDIT
   ========================================================== */
const CONFIG = {

  // ---- WHO IS IT FOR? ----
  name: "My Love",                 // appears as "Dear My Love,"
  occasion: "Happy Birthday! 🎂",  // small heading above the name
  envelopeLabel: "For you…",       // text on the little card in the envelope
  hint: "tap the envelope 💌",     // text above the envelope

  // ---- YOUR LETTER ----
  message:
`Today is all about you.

I hope your day is full of cake, laughter and everything that makes you smile. You make ordinary moments feel like my favorite memories.

I don't say it enough: you are someone really special to me, and I'm so glad you were born.

Happy birthday. Here's to another year of you.`,
  signature: "Yours always ♥",
  wishMessage: "Wish made. I hope it comes true 💖",

  // ---- MUSIC ----
  // Put your own audio file (mp3) in the SAME folder as this file,
  // then write its file name here. Example: "ruin-the-friendship.mp3"
  // (Song files are copyrighted, so none is included — use a copy
  //  you legally own.) Leave as "" to turn music off.
  musicFile: "https://videotourl.com/audio/1793549209296-b02fbe7f-633f-4df5-8447-8c9521ce5e00.mp3",
  musicVolume: 0.6,                // 0 = silent, 1 = loudest

  // ---- BACKGROUND IMAGE (optional) ----
  // Put a picture in the same folder and type its name, e.g. "us.jpg".
  // Leave as "" to keep the pink-and-red gradient from the CSS.
  backgroundImage: "https://n.sinaimg.cn/spider20250708/614/w696h718/20250708/a0b2-3bed028956816e81233d08acceec6e41.png",

  // ---- DECORATIONS ----
  hearts: ["💗", "💖", "💕", "♥", "🌸", "💘"],
  heartEverySeconds: 0.8,          // lower = more hearts
  confettiColors: ["#ff5c8a", "#ff9ebb", "#d6254d", "#fff6f0", "#ffd36e"],
  confettiAmount: 70
};


/* ==========================================================
   CODE  (you don't have to change anything below)
   ========================================================== */

// --- Grab the elements from the page ---
const $ = (id) => document.getElementById(id);
const scene = $("scene"), envelope = $("envelope"), reader = $("reader");
const musicBtn = $("musicBtn"), flame = $("flame");

// --- Fill in the text from CONFIG ---
$("occasion").textContent       = CONFIG.occasion;
$("letterTitle").textContent    = "Dear " + CONFIG.name + ",";
$("letterBody").textContent     = CONFIG.message;
$("letterSignature").textContent = CONFIG.signature;
$("envelopeLabel").textContent  = CONFIG.envelopeLabel;
$("hint").textContent           = CONFIG.hint;

// --- Background picture (if one was given) ---
if (CONFIG.backgroundImage) {
  document.body.style.background =
    `linear-gradient(rgba(214,37,77,.25), rgba(255,158,187,.25)),
     url("${CONFIG.backgroundImage}") center / cover fixed`;
}

// --- Bunting flags across the top ---
for (let i = 0; i < 14; i++) $("bunting").appendChild(document.createElement("i"));

// --- MUSIC ---
let audio = null;
if (CONFIG.musicFile) {
  audio = new Audio(CONFIG.musicFile);
  audio.loop = true;
  audio.volume = CONFIG.musicVolume;
  musicBtn.style.display = "block";
}

function playMusic() {
  if (!audio) return;
  audio.play()
    .then(() => musicBtn.classList.add("playing"))
    .catch(() => {});            // browser blocked it; the button still works
}

musicBtn.addEventListener("click", () => {
  if (!audio) return;
  if (audio.paused) { playMusic(); }
  else { audio.pause(); musicBtn.classList.remove("playing"); }
});

// --- OPEN / CLOSE THE ENVELOPE ---
let isOpen = false;

function openEnvelope() {
  if (isOpen) return;
  isOpen = true;
  envelope.classList.add("open");
  scene.classList.add("opened");
  playMusic();                                  // music starts on the first tap
  setTimeout(() => {
    reader.classList.add("show");
    confettiBurst();
  }, 1500);
  burstHearts(14);
}

function closeLetter() {
  reader.classList.remove("show");
  envelope.classList.remove("open");
  scene.classList.remove("opened");
  flame.classList.remove("out");
  $("wish").textContent = "tap the flame & make a wish ✨";
  isOpen = false;
}

envelope.addEventListener("click", openEnvelope);
envelope.addEventListener("keydown", (e) => {
  if (e.key === "Enter" || e.key === " ") openEnvelope();
});
$("closeBtn").addEventListener("click", closeLetter);

// --- BLOW OUT THE CANDLE ---
$("cake").addEventListener("click", () => {
  if (flame.classList.contains("out")) return;
  flame.classList.add("out");
  $("wish").textContent = CONFIG.wishMessage;
  confettiBurst();
  burstHearts(10);
});

// --- FLOATING HEARTS ---
function spawnHeart() {
  const heart = document.createElement("span");
  heart.className = "floating-heart";
  heart.textContent = CONFIG.hearts[Math.floor(Math.random() * CONFIG.hearts.length)];
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.fontSize = 16 + Math.random() * 26 + "px";
  heart.style.animationDuration = 6 + Math.random() * 6 + "s";
  document.body.appendChild(heart);
  setTimeout(() => heart.remove(), 12000);
}
function burstHearts(count) {
  for (let i = 0; i < count; i++) setTimeout(spawnHeart, i * 80);
}
setInterval(spawnHeart, CONFIG.heartEverySeconds * 1000);

// --- CONFETTI ---
function confettiBurst() {
  for (let i = 0; i < CONFIG.confettiAmount; i++) {
    const piece = document.createElement("span");
    piece.className = "confetti";
    piece.style.left = Math.random() * 100 + "vw";
    piece.style.background =
      CONFIG.confettiColors[Math.floor(Math.random() * CONFIG.confettiColors.length)];
    piece.style.animationDuration = 2.5 + Math.random() * 2.5 + "s";
    piece.style.animationDelay = Math.random() * 0.6 + "s";
    document.body.appendChild(piece);
    setTimeout(() => piece.remove(), 6000);
  }
}
</script>

</body>
</html>
